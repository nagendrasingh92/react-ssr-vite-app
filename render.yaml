services:
  - type: web
    name: react-ssr-vite
    env: node
    plan: free
    buildCommand: |
      npm ci
      echo "Building client..."
      npm run build:client
      echo "Building server..."
      npm run build:server
      echo "Build completed successfully"
    startCommand: npm start
    nodeVersion: 18
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
